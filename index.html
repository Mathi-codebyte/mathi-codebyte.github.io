<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alfa Osmosian Apps</title>
<style>
  :root { --bg: #fbf8ff; --ink: #1f1838; --soft: #5b5476; --accent: #5a35c9; --card: #ffffff; --line: #e6e0f5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #120d26; --ink: #efeaff; --soft: #b4abd4; --accent: #c4b0ff; --card: #1c1636; --line: #2f2752; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 1.8rem; margin: 0 0 4px; }
  .soft { color: var(--soft); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-top: 24px; }
  h2 { margin: 0 0 6px; font-size: 1.25rem; }
  a { color: var(--accent); }
  ul { padding-left: 20px; margin: 8px 0 0; }
</style>
</head>
<body>
<main>
  <h1>Alfa Osmosian Apps</h1>
  <p class="soft">Calm, offline-friendly games for Android.</p>

  <div class="card">
    <h2>Glimmerwords: Word Puzzle Game</h2>
    <p>Swipe letters to light up words, learn what every word means, and uncover hidden relics across 400 levels.</p>
    <ul>
      <li><a href="https://play.google.com/store/apps/details?id=com.wordlume">Get it on Google Play</a></li>
      <li><a href="https://mathi-codebyte.github.io/wordlume-privacy/">Privacy policy</a></li>
    </ul>
  </div>

  <p class="soft" style="margin-top:32px">Contact: <a href="mailto:devoffice7@gmail.com">devoffice7@gmail.com</a></p>
</main>
</body>
</html>
